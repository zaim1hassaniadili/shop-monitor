version: "3.3"

services:
  db:
    image: postgres:13
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - ${SERVER_URL}
    environment:
      - "POSTGRES_PASSWORD:${POSTGRES_PASSWORD}"
      - "POSTGRES_DB:${POSTGRES_DB}"
      - "POSTGRES_USER:${POSTGRES_USER}"
    volumes:
      - data_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U hiemale -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - my_custom_network

  back:
    image: back
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      - "POSTGRES_URL=${POSTGRES_URL}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD:${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_custom_network

volumes:
  data_db:

networks:
  my_custom_network:
    driver: bridge
